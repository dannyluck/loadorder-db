<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MM2 Collection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --text:#f5f5f5;
  --muted:#8f8f8f;
  --border:rgba(255,255,255,.10);
  --green:#6cff9d;

  --ancients:#ff934f;
  --vintages:#e8c547;
  --godlies:#ff4d7a;
  --legendaries:#4d9fff;
  --rares:#39cfff;
  --uncommons:#48d985;
  --commons:#a6a6a6;
  --pets:#f066c9;
  --other:#f2a64a;
}

*{box-sizing:border-box}

html,body{
  min-height:100%;
}

body{
  margin:0;
  background:#000;
  color:var(--text);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-x:hidden;
}

.background-layer{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  background:#000;
}

.background-layer canvas{
  display:block;
  width:100%;
  height:100%;
}

.page-shell{
  position:relative;
  z-index:1;
  width:min(1500px,calc(100% - 28px));
  margin:0 auto;
  padding:24px 0 44px;
}

.glass{
  background:rgba(8,8,8,.36);
  border:1px solid var(--border);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),
    0 16px 44px rgba(0,0,0,.25);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
  backdrop-filter:blur(18px) saturate(125%);
}

.dashboard{
  padding:14px;
  margin-bottom:14px;
  border-radius:18px;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.progress-wrap{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  height:22px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  background:rgba(10,10,10,.36);
}

.progress-bar{
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,rgba(255,255,255,.20),rgba(255,255,255,.65),rgba(255,255,255,.28));
  transition:width .22s ease;
}


.owned-count{
  flex:0 0 auto;
  min-width:64px;
  color:rgba(255,255,255,.78);
  font:700 12px/1 "Space Grotesk",sans-serif;
  letter-spacing:-.01em;
  text-align:right;
  white-space:nowrap;
}

.progress-percent{
  position:absolute;
  inset:0;
  z-index:2;
  display:grid;
  place-items:center;
  color:#f5f5f5;
  font:700 10px/1 "Space Grotesk",sans-serif;
  letter-spacing:.02em;
  text-shadow:0 1px 5px rgba(0,0,0,.85);
  pointer-events:none;
}

.controls{
  display:grid;
  grid-template-columns:minmax(240px,1fr) auto;
  gap:10px;
  padding:12px;
  margin-bottom:16px;
  border-radius:18px;
}

#searchBox{
  width:100%;
  height:44px;
  padding:0 15px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  outline:none;
  background:rgba(10,10,10,.38);
  color:var(--text);
  font:500 14px "Manrope",sans-serif;
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
}

#searchBox::placeholder{
  color:rgba(255,255,255,.40);
}

#searchBox:focus{
  border-color:rgba(255,255,255,.20);
  box-shadow:0 0 0 4px rgba(255,255,255,.025);
}

.control-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  height:42px;
  padding:0 15px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  background:rgba(10,10,10,.38);
  color:var(--text);
  font:600 12px "Space Grotesk",sans-serif;
  cursor:pointer;
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
}

button:hover{
  background:rgba(20,20,20,.52);
}

.filter-btn.active{
  border-color:rgba(255,255,255,.20);
  background:rgba(25,25,25,.56);
}




@keyframes spin{
  to{transform:rotate(360deg)}
}

.category{
  --cat:#888;
  --cat-light:#bdbdbd;
  --cat-deep:#444;
  --cat-glow:rgba(255,255,255,.18);
  margin-bottom:16px;
}

.category-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px 18px;
  cursor:pointer;
  border-radius:18px 18px 0 0;
  background:
    linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.018)),
    linear-gradient(135deg,
      color-mix(in srgb,var(--cat-light) 52%,rgba(10,10,10,.18)) 0%,
      color-mix(in srgb,var(--cat) 42%,rgba(10,10,10,.46)) 46%,
      color-mix(in srgb,var(--cat-deep) 72%,rgba(8,8,8,.88)) 100%
    );
  border:1px solid color-mix(in srgb,var(--cat) 35%,rgba(255,255,255,.10));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 18px 38px rgba(0,0,0,.22),
    0 0 26px var(--cat-glow);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
  backdrop-filter:blur(18px) saturate(125%);
}

.category-header.collapsed{
  border-radius:18px;
}

.category-header h2{
  margin:0;
  color:var(--cat-light);
  text-shadow:0 0 16px color-mix(in srgb,var(--cat) 35%, transparent);
  font:700 16px "Space Grotesk",sans-serif;
  letter-spacing:-.025em;
}

.category-header h2 span{
  color:#9b9b9b;
  font-size:12px;
  font-weight:500;
}

.category-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.cat-progress{
  color:rgba(255,255,255,.58);
  font:600 12px/1 "Manrope",system-ui,sans-serif;
  letter-spacing:.015em;
  font-variant-numeric:tabular-nums;
}

.chev{
  color:#aaa;
  transition:transform .18s ease;
}

.category-header.collapsed .chev{
  transform:rotate(-90deg);
}

.items-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(205px,1fr));
  gap:14px;
  padding:15px;
  border:1px solid color-mix(in srgb,var(--cat) 18%,rgba(255,255,255,.09));
  border-top:0;
  border-radius:0 0 18px 18px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.006)),
    rgba(6,6,6,.28);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
  backdrop-filter:blur(18px) saturate(120%);
}

.items-grid.collapsed{
  display:none;
}

.item-card{
  position:relative;
  min-height:244px;
  padding:18px 16px 15px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:9px;
  text-align:center;
  border-radius:16px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.042),rgba(255,255,255,.012)),
    rgba(7,7,7,.40);
  border:1px solid rgba(255,255,255,.085);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 12px 30px rgba(0,0,0,.20);
  -webkit-backdrop-filter:blur(16px) saturate(115%);
  backdrop-filter:blur(16px) saturate(115%);
  transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
}

.item-card::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 5%,color-mix(in srgb,var(--cat) 10%,transparent),transparent 48%);
  opacity:.75;
}

.item-card:hover{
  transform:translateY(-3px);
  border-color:color-mix(in srgb,var(--cat) 30%,rgba(255,255,255,.18));
  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),
    rgba(9,9,9,.48);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),
    0 18px 38px rgba(0,0,0,.25),
    0 0 26px color-mix(in srgb,var(--cat) 6%,transparent);
}

.card-accent{
  position:absolute;
  top:0;
  left:22%;
  right:22%;
  height:2px;
  border-radius:0 0 999px 999px;
  background:linear-gradient(90deg,transparent,var(--cat),transparent);
  box-shadow:0 0 14px color-mix(in srgb,var(--cat) 42%,transparent);
  opacity:.82;
}

.item-card.owned{
  border-color:rgba(108,255,157,.34);
  background:
    linear-gradient(180deg,rgba(108,255,157,.025),rgba(255,255,255,.012)),
    rgba(7,7,7,.42);
}

.item-card.owned::after{
  content:"✓";
  position:absolute;
  top:10px;
  right:10px;
  width:23px;
  height:23px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(108,255,157,.94);
  box-shadow:0 5px 14px rgba(0,0,0,.28);
  color:#050505;
  font:800 11px/1 "Manrope",sans-serif;
}

.item-media{
  position:relative;
  z-index:1;
  width:100%;
  height:144px;
  display:grid;
  place-items:center;
  overflow:visible;
  background:none !important;
  border:0;
  border-radius:0;
}

.item-media::before,
.item-media::after{
  content:none !important;
  display:none !important;
}

.item-card img{
  position:relative;
  z-index:1;
  width:136px;
  height:136px;
  object-fit:contain;
  background:none !important;
  mix-blend-mode:normal;
  filter:drop-shadow(0 15px 15px rgba(0,0,0,.42));
  transition:transform .18s ease,filter .18s ease;
}

.item-card:hover img{
  transform:translateY(-2px) scale(1.025);
  filter:drop-shadow(0 17px 17px rgba(0,0,0,.46));
}

.item-card img.placeholder-image{
  width:112px;
  height:112px;
  border-radius:12px;
  opacity:.55;
  mix-blend-mode:normal;
  filter:none;
}

.item-card .name{
  position:relative;
  z-index:1;
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.92);
  font:650 13px/1.35 "Manrope",system-ui,sans-serif;
  letter-spacing:-.012em;
}

.chk{
  position:relative;
  z-index:1;
  min-height:27px;
  padding:4px 9px 4px 6px;
  display:flex;
  align-items:center;
  gap:6px;
  color:rgba(255,255,255,.48);
  font:600 10px/1 "Manrope",system-ui,sans-serif;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.065);
  border-radius:999px;
  background:rgba(255,255,255,.025);
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}

.chk:hover{
  color:rgba(255,255,255,.72);
  border-color:rgba(255,255,255,.11);
  background:rgba(255,255,255,.045);
}

.chk input{
  width:15px;
  height:15px;
  margin:0;
  accent-color:var(--green);
}

.item-card.hidden{
  display:none;
}

.error-box{
  padding:20px;
  border-radius:18px;
  color:#bbb;
  font-size:13px;
  line-height:1.6;
}


/* Category completion celebration */
.category-header.category-complete-pop{
  animation:categoryCompletePop .72s cubic-bezier(.2,.85,.25,1);
}

@keyframes categoryCompletePop{
  0%{transform:scale(1);filter:brightness(1)}
  35%{transform:scale(1.012);filter:brightness(1.22)}
  100%{transform:scale(1);filter:brightness(1)}
}

.category-complete-toast{
  position:fixed;
  left:50%;
  top:28px;
  z-index:10002;
  transform:translate(-50%,-14px) scale(.96);
  opacity:0;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid color-mix(in srgb,var(--toast-cat,#fff) 48%,rgba(255,255,255,.12));
  background:rgba(8,8,8,.72);
  color:#fff;
  box-shadow:0 12px 34px rgba(0,0,0,.34),0 0 24px color-mix(in srgb,var(--toast-cat,#fff) 18%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  backdrop-filter:blur(18px) saturate(130%);
  font:650 12px/1 "Manrope",system-ui,sans-serif;
  letter-spacing:.01em;
  pointer-events:none;
  animation:categoryToast 1.75s ease forwards;
}

@keyframes categoryToast{
  0%{opacity:0;transform:translate(-50%,-14px) scale(.96)}
  14%,72%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-8px) scale(.98)}
}

.confetti-piece{
  position:fixed;
  z-index:10001;
  width:7px;
  height:12px;
  border-radius:2px;
  pointer-events:none;
  will-change:transform,opacity;
}

@media (prefers-reduced-motion:reduce){
  .category-header.category-complete-pop,
  .category-complete-toast{animation:none}
  .confetti-piece{display:none}
}

@media(max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .controls{grid-template-columns:1fr}
}

@media(max-width:500px){
  .page-shell{
    width:calc(100% - 16px);
    padding-top:10px;
  }
  .items-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
    padding:9px;
  }
  .item-card{min-height:206px;padding:13px 10px 12px}
  .item-media{width:100%;height:112px}
  .item-card img{width:106px;height:106px}
  .item-card .name{font-size:12px;min-height:32px}
}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,
  .stat-card,
  .category-header,
  .items-grid,
  .item-card,
  button,
  #searchBox{
    background:rgba(12,12,12,.88);
  }
}

/* Fullscreen loading state */
body.is-loading{
  overflow:hidden;
}

body.is-loading .page-shell{
  filter:blur(10px);
  transform:scale(.995);
  pointer-events:none;
  user-select:none;
}

.page-shell{
  transition:filter .25s ease,transform .25s ease,opacity .25s ease;
}





.loading-card{
  min-width:min(360px,calc(100vw - 40px));
  padding:28px 30px;
  display:grid;
  justify-items:center;
  gap:15px;
  border-radius:22px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.018)),
    rgba(8,8,8,.70);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 30px 80px rgba(0,0,0,.55);
  -webkit-backdrop-filter:blur(26px) saturate(130%);
  backdrop-filter:blur(26px) saturate(130%);
}



.loading-title{
  font:700 15px/1.2 "Space Grotesk",sans-serif;
  letter-spacing:-.02em;
}

.loading-subtitle{
  color:rgba(255,255,255,.50);
  font-size:11px;
  font-weight:600;
}

@keyframes loadingSpin{
  to{transform:rotate(360deg)}
}




.sync-status.hidden{
  display:none;
}


.loading-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% 42%, rgba(255,255,255,.035), transparent 34%),
    rgba(2,2,2,.68);
  backdrop-filter:blur(18px) saturate(.88);
  -webkit-backdrop-filter:blur(18px) saturate(.88);
  transition:opacity .28s ease,visibility .28s ease;
}

.loading-overlay.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loading-overlay::before{
  content:"";
  position:absolute;
  width:min(420px,78vw);
  aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(circle, rgba(255,255,255,.035), transparent 62%);
  filter:blur(18px);
  pointer-events:none;
}

.loading-spinner{
  position:relative;
  z-index:1;
  width:42px;
  height:42px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.10);
  border-top-color:rgba(255,255,255,.95);
  border-right-color:rgba(255,255,255,.42);
  animation:mm2-spin .72s cubic-bezier(.65,.05,.36,1) infinite;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.025),
    0 0 24px rgba(255,255,255,.08);
}

.loading-spinner::after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.075);
}

.loading-text{
  position:absolute;
  top:calc(50% + 42px);
  z-index:1;
  max-width:min(72vw,420px);
  color:rgba(255,255,255,.66);
  font:650 12px/1.25 "Manrope",sans-serif;
  letter-spacing:.02em;
  text-align:center;
  text-wrap:balance;
  text-shadow:0 1px 10px rgba(0,0,0,.45);
}

@keyframes mm2-spin{
  to{transform:rotate(360deg);}
}



/* Performance pass */
.category{
  content-visibility:auto;
  contain-intrinsic-size:720px;
}

.items-grid{
  contain:layout paint style;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  background:rgba(6,6,6,.54);
}

.item-card{
  contain:layout paint style;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  transform:translateZ(0);
}

.item-card img{
  content-visibility:auto;
}

@media (hover:none){
  .item-card:hover{transform:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 12px 30px rgba(0,0,0,.20)}
  .item-card:hover img{transform:none;filter:drop-shadow(0 15px 15px rgba(0,0,0,.42))}
}

/* Reworked loading screen: lightweight, no full-screen backdrop blur */
.loading-overlay{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  background:rgba(0,0,0,.94);
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
}

.loading-overlay::before{
  width:240px;
  background:radial-gradient(circle,rgba(255,255,255,.045),transparent 68%);
  filter:none;
}

.loading-spinner{
  width:52px;
  height:52px;
  border:0;
  background:
    conic-gradient(from 0deg,rgba(255,255,255,.95),rgba(255,255,255,.18) 34%,rgba(255,255,255,.05) 58%,rgba(255,255,255,.95));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);
  box-shadow:none;
  animation:mm2-spin .82s linear infinite;
}

.loading-spinner::after{display:none}

.loading-text{
  position:static;
  max-width:min(78vw,520px);
  color:rgba(255,255,255,.58);
  font:600 12px/1.35 "Manrope",sans-serif;
  letter-spacing:.01em;
  text-shadow:none;
}

.loading-text::before{
  content:"MM2 COLLECTION";
  display:block;
  margin-bottom:7px;
  color:rgba(255,255,255,.94);
  font:700 14px/1 "Manrope",sans-serif;
  letter-spacing:.12em;
}

@media (prefers-reduced-motion:reduce){
  .loading-spinner{animation-duration:1.8s}
  .item-card,.item-card img{transition:none}
}

</style>
</head>

<body>
<div id="loadingOverlay" class="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div id="loadingText" class="loading-text">Loading collection…</div>
  </div>
<div class="background-layer" aria-hidden="true"></div>

<div class="page-shell">
  <section class="dashboard glass">
    <div class="progress-row">
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-percent" id="progressPercent">0%</div>
      </div>
      <div class="owned-count" id="statOwned">0/0</div>
    </div>
  </section>
<section class="controls glass">
    <input id="searchBox" type="text" placeholder="Search items..." autocomplete="off">
    <div class="control-buttons">
      <button id="btnAll" class="filter-btn active">All</button>
      <button id="btnOwned" class="filter-btn">Owned</button>
      <button id="btnMissing" class="filter-btn">Missing</button>
    </div>
  </section>

  <main id="categories"></main>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';

const host = document.querySelector('.background-layer');

if (host) {
  try {
    const renderer = new THREE.WebGLRenderer({
      alpha:true,
      antialias:false,
      powerPreference:'high-performance'
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.15));
    renderer.setClearColor(0x000000,1);
    host.replaceChildren(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    const geometry = new THREE.PlaneGeometry(2,2);

    const material = new THREE.ShaderMaterial({
      uniforms:{
        uTime:{value:0},
        uResolution:{value:new THREE.Vector2(1,1)}
      },
      vertexShader:`
        void main(){
          gl_Position=vec4(position,1.0);
        }
      `,
      fragmentShader:`
        precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;

        float hash(vec2 p){
          p=fract(p*vec2(123.34,345.45));
          p+=dot(p,p+34.345);
          return fract(p.x*p.y);
        }

        float noise(vec2 p){
          vec2 i=floor(p);
          vec2 f=fract(p);
          f=f*f*(3.0-2.0*f);

          float a=hash(i);
          float b=hash(i+vec2(1.0,0.0));
          float c=hash(i+vec2(0.0,1.0));
          float d=hash(i+vec2(1.0,1.0));

          return mix(
            mix(a,b,f.x),
            mix(c,d,f.x),
            f.y
          );
        }

        float fbm(vec2 p){
          float value=0.0;
          float amp=.55;

          for(int i=0;i<6;i++){
            value+=amp*noise(p);
            p=p*2.03+vec2(11.7,7.3);
            amp*=.50;
          }

          return value;
        }

        void main(){
          vec2 uv=gl_FragCoord.xy/uResolution.xy;
          vec2 p=uv;
          p.x*=uResolution.x/max(uResolution.y,1.0);

          float t=uTime;

          float n1=fbm(p*2.3+vec2(t*.045,sin(t*.16)*.08));
          float n2=fbm(p*3.8+vec2(-t*.026,cos(t*.13)*.10));
          float n3=fbm(p*1.25+vec2(t*.015,-t*.010));

          float fog=n1*.52+n2*.30+n3*.24;
          fog=smoothstep(.42,.94,fog);

          float vignette=smoothstep(.98,.20,distance(uv,vec2(.5)));
          fog*=.55+vignette*.55;

          vec3 smoke=vec3(.30,.32,.35);
          vec3 color=mix(vec3(0.0),smoke,fog*.88);

          gl_FragColor=vec4(color,1.0);
        }
      `
    });

    scene.add(new THREE.Mesh(geometry,material));

    function resize(){
      const w=Math.max(innerWidth,1);
      const h=Math.max(innerHeight,1);

      renderer.setSize(w,h,false);
      material.uniforms.uResolution.value.set(
        w*renderer.getPixelRatio(),
        h*renderer.getPixelRatio()
      );
    }

    resize();
    addEventListener('resize',resize);

    const timer=new THREE.Timer();
    timer.connect(document);

    let bgRunning=true;
    function renderBackground(timestamp){
      if(!bgRunning) return;
      timer.update(timestamp);
      material.uniforms.uTime.value=timer.getElapsed();
      renderer.render(scene,camera);
    }
    renderer.setAnimationLoop(renderBackground);

    document.addEventListener('visibilitychange',()=>{
      bgRunning=!document.hidden;
      if(bgRunning) renderer.setAnimationLoop(renderBackground);
      else renderer.setAnimationLoop(null);
    });
  } catch(error){
    console.error('Three.js background:',error);
  }
}
</script>

<script>
const DB_STORAGE_KEY='mm2fandomDatabaseV4';
const RAW_CACHE_KEY='mm2fandomRawPagesV4';
const UI_STATE_KEY='mm2checkerUiStateV1';
const OWNED_STORAGE_KEY='mm2checkerOwnedV1';
const DB_MAX_AGE=1000*60*60*12;

const FANDOM_API='https://murder-mystery-2.fandom.com/api.php';
const FANDOM_WIKI='https://murder-mystery-2.fandom.com/wiki/';
const MM2VALUES_MISC='https://www.mm2values.com/?p=misc';
const MM2VALUES_MISC_READER='https://r.jina.ai/https://www.mm2values.com/?p=misc';

const CATEGORY_ORDER=[
  'Unique','EVO','Ancients','Vintages','Godlies',
  'Legendaries','Rares','Uncommons','Commons','Pets','Misc'
];

const CATEGORY_THEMES={
  "Unique":{base:"#E68A00",light:"#FFA31A",deep:"#9A5A0A",glow:"rgba(230,138,0,.28)"},
  "EVO":{base:"#9a5cff",light:"#c09aff",deep:"#5830a8",glow:"rgba(154,92,255,.30)"},
  "Ancients":{base:"#6615FD",light:"#7B36FF",deep:"#4610AD",glow:"rgba(102,21,253,.30)"},
  "Vintages":{base:"#E5C715",light:"#F3D936",deep:"#9D8810",glow:"rgba(229,199,21,.28)"},
  "Godlies":{base:"#FF0AB1",light:"#FF43C4",deep:"#A90076",glow:"rgba(255,10,177,.30)"},
  "Legendaries":{base:"#DB0206",light:"#F3272B",deep:"#8E0104",glow:"rgba(219,2,6,.30)"},
  "Rares":{base:"#00C715",light:"#29E63B",deep:"#007C0D",glow:"rgba(0,199,21,.28)"},
  "Uncommons":{base:"#00FFFF",light:"#47FFFF",deep:"#00A5A5",glow:"rgba(0,255,255,.27)"},
  "Commons":{base:"#696969",light:"#8A8A8A",deep:"#454545",glow:"rgba(105,105,105,.22)"},
  "Pets":{base:"#d95db7",light:"#ff9ce1",deep:"#7d2b66",glow:"rgba(217,93,183,.28)"},
  "Misc":{base:"#c89a67",light:"#f5cd9e",deep:"#705032",glow:"rgba(200,154,103,.24)"}
};

let DATA={};
let owned=loadJson(OWNED_STORAGE_KEY,{});

const savedUiState=loadJson(UI_STATE_KEY,{filter:'all',search:'',collapsed:{}});
let currentFilter=['all','owned','missing'].includes(savedUiState.filter)?savedUiState.filter:'all';
let searchTerm=String(savedUiState.search||'').toLowerCase();
let collapsedCategories={...(savedUiState.collapsed||{})};

function loadJson(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):fallback;
  }catch{return fallback;}
}

function saveOwned(){localStorage.setItem(OWNED_STORAGE_KEY,JSON.stringify(owned));}
function saveUiState(){
  localStorage.setItem(UI_STATE_KEY,JSON.stringify({filter:currentFilter,search:searchTerm,collapsed:collapsedCategories}));
}
function saveRawCache(records){
  try{localStorage.setItem(RAW_CACHE_KEY,JSON.stringify({savedAt:Date.now(),records}));}
  catch(error){console.warn('Fandom raw cache write failed:',error);}
}
function getRawCache(){
  const cache=loadJson(RAW_CACHE_KEY,null);
  return cache&&Array.isArray(cache.records)&&cache.records.length?cache:null;
}
function saveDatabase(data){
  try{localStorage.setItem(DB_STORAGE_KEY,JSON.stringify({savedAt:Date.now(),data}));}
  catch(error){console.warn('Database cache write failed:',error);}
}
function getCachedDatabase(){
  const cache=loadJson(DB_STORAGE_KEY,null);
  if(!cache||!cache.data||typeof cache.savedAt!=='number') return null;
  return cache;
}
function normalizeName(value){return String(value||'').replace(/\s+/g,' ').trim();}
function normalizeKey(value){return normalizeName(value).toLowerCase().replace(/[’']/g,'').trim();}
function placeholderUrl(){return 'https://placehold.co/220x220/0b0b0b/666666?text=No+Image';}
function itemKey(category,item){return item.href||item.id||`${category}::${item.name}`;}

function wikiUrl(title){
  return `${FANDOM_WIKI}${encodeURIComponent(String(title||'').replace(/ /g,'_')).replace(/%2F/g,'/')}`;
}

function normalizeRemoteImageUrl(value){
  const raw=String(value||'').trim();
  if(!raw) return '';

  // GitHub Pages is HTTPS, so never leave an HTTP image URL that would be
  // blocked as mixed content. Fandom/Wikia assets are available over HTTPS.
  if(raw.startsWith('http://')) return `https://${raw.slice(7)}`;
  if(raw.startsWith('//')) return `https:${raw}`;
  return raw;
}

function setLoader(show,text='Loading collection…'){
  const overlay=document.getElementById('loadingOverlay');
  const label=document.getElementById('loadingText');
  if(label) label.textContent=text;
  document.body.classList.toggle('is-loading',show);
  if(overlay){
    overlay.classList.toggle('hidden',!show);
    overlay.setAttribute('aria-busy',show?'true':'false');
  }
}

async function fetchJson(url,timeout=20000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const response=await fetch(url,{signal:controller.signal,cache:'no-store',mode:'cors',credentials:'omit'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  }finally{clearTimeout(timer);}
}

async function fetchText(url,timeout=20000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const response=await fetch(url,{
      signal:controller.signal,
      cache:'no-store',
      mode:'cors',
      credentials:'omit',
      headers:{'Accept':'text/plain,text/markdown;q=0.9,*/*;q=0.8'}
    });
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.text();
  }finally{clearTimeout(timer);}
}

function absoluteUrl(value,base){
  try{return new URL(value,base).href;}
  catch{return value||'';}
}

function cleanMarkdownText(value){
  return String(value||'')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,' ')
    .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
    .replace(/<[^>]+>/g,' ')
    .replace(/[*_`#>|]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function parseMM2ValuesMisc(text){
  const records=[];
  const seen=new Set();
  const source=String(text||'');
  if(!source) return records;

  const lower=source.toLowerCase();
  const start=Math.max(0,lower.indexOf('misc items'));
  const endPos=lower.indexOf('© mm2values',start);
  const region=source.slice(start,endPos>start?endPos:source.length);
  const valueRe=/\bValue\s*:/gi;
  let match;
  let previousBoundary=0;

  while((match=valueRe.exec(region))){
    const before=region.slice(previousBoundary,match.index);
    previousBoundary=match.index+match[0].length;

    // Prefer the final MM2Values image in this item block.
    const imageMatches=[...before.matchAll(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/gi)];
    let img='';
    for(let i=imageMatches.length-1;i>=0;i--){
      const candidate=imageMatches[i][1];
      if(/mm2values\.com\/img\//i.test(candidate)){
        img=candidate;
        break;
      }
    }

    const lines=before.split(/\r?\n/)
      .map(line=>cleanMarkdownText(line))
      .filter(Boolean)
      .filter(line=>{
        const key=normalizeKey(line);
        return !(
          /^tier\s*\d+/i.test(line) ||
          key==='misc items' ||
          /^working on updating images/i.test(line) ||
          /^sort by/i.test(line) ||
          /^display/i.test(line) ||
          /^navigation$/i.test(line) ||
          /^image(?:\s*\d+)?$/i.test(line)
        );
      });

    let name='';
    for(let i=lines.length-1;i>=0;i--){
      const candidate=lines[i]
        .replace(/^Image(?:\s*\d+)?\s*:\s*/i,'')
        .trim();
      if(!candidate || candidate.length>80) continue;
      if(/^(wiki|range|demand|rarity|stability|stable)$/i.test(candidate)) continue;
      name=candidate;
      break;
    }

    if(!name) continue;
    const key=normalizeKey(name);
    if(!key || seen.has(key)) continue;
    seen.add(key);

    records.push({
      id:`mm2values:misc:${key}`,
      name,
      href:MM2VALUES_MISC,
      img:img?absoluteUrl(img,MM2VALUES_MISC):'',
      category:'Misc',
      type:'Misc'
    });
  }

  return records;
}

async function fetchMiscItems(){
  const text=await fetchText(MM2VALUES_MISC_READER,20000);
  if(!text || text.length<300) throw new Error('MM2Values reader returned an empty response.');
  const items=parseMM2ValuesMisc(text);
  if(!items.length) throw new Error('MM2Values Misc parser returned 0 items.');
  console.info(`MM2Values Misc: ${items.length} items`);
  return items;
}

async function fetchCategoryIndex(categoryName,onProgress){
  const members=[];
  let continuation='';
  let pageNumber=0;

  do{
    pageNumber++;
    const params=new URLSearchParams({
      action:'query',
      format:'json',
      formatversion:'2',
      origin:'*',
      list:'categorymembers',
      cmtitle:`Category:${categoryName}`,
      cmnamespace:'0',
      cmtype:'page',
      cmlimit:'500'
    });

    if(continuation) params.set('cmcontinue',continuation);

    const json=await fetchJson(`${FANDOM_API}?${params}`);
    const pageMembers=Array.isArray(json?.query?.categorymembers)
      ? json.query.categorymembers
      : [];

    members.push(...pageMembers);
    continuation=json?.continue?.cmcontinue||'';

    console.info(
      `Fandom index ${categoryName} page ${pageNumber}: `+
      `${pageMembers.length} returned, ${members.length} total`
    );

    if(onProgress) onProgress(members.length,pageNumber);
  }while(continuation);

  return members;
}

function memberKey(member){
  return String(member?.pageid||'') || `title:${normalizeKey(member?.title)}`;
}

function buildMemberSet(members){
  const ids=new Set();
  const titles=new Set();

  for(const member of members){
    if(member?.pageid) ids.add(String(member.pageid));
    if(member?.title) titles.add(normalizeKey(member.title));
  }

  return {ids,titles};
}

function inMemberSet(page,set){
  return set.ids.has(String(page.pageid||'')) || set.titles.has(normalizeKey(page.title));
}

function isMetaTitle(title){
  const key=normalizeKey(title);
  return (
    key==='weapons' || key==='evo weapons' || key==='pets' ||
    key==='pet box' || key==='common egg' ||
    /^(ancient|vintage|classic|godly|legendary|rare|uncommon|common|unique|chroma) weapons$/.test(key) ||
    /^(knives|guns|fire pets|chroma fire pets)$/.test(key)
  );
}

async function fetchPageDetails(members,onProgress){
  const pages=[];
  const ids=members
    .map(member=>member.pageid)
    .filter(Boolean);

  const chunkSize=50;

  for(let offset=0;offset<ids.length;offset+=chunkSize){
    const chunk=ids.slice(offset,offset+chunkSize);
    const params=new URLSearchParams({
      action:'query',
      format:'json',
      formatversion:'2',
      origin:'*',
      pageids:chunk.join('|'),
      prop:'pageimages|info|categories',
      piprop:'thumbnail|original',
      pithumbsize:'300',
      inprop:'url',
      cllimit:'500'
    });

    const json=await fetchJson(`${FANDOM_API}?${params}`);
    const batch=Array.isArray(json?.query?.pages)?json.query.pages:[];
    pages.push(...batch);

    if(onProgress) onProgress(Math.min(offset+chunk.length,ids.length),ids.length);
  }

  return pages;
}

function pageCategoryNames(page){
  return new Set(
    (Array.isArray(page?.categories)?page.categories:[])
      .map(entry=>normalizeKey(String(entry?.title||'').replace(/^Category:/i,'')))
      .filter(Boolean)
  );
}

function classifyWeapon(page){
  const cats=pageCategoryNames(page);

  // Evo is an item type spanning Rare → Legendary → Godly → Ancient.
  // Keep it separate instead of classifying its current/final stage as a normal rarity.
  if(cats.has('evo')) return 'EVO';
  if(cats.has('unique')) return 'Unique';
  if(cats.has('ancient')) return 'Ancients';
  if(cats.has('vintage')) return 'Vintages';
  if(cats.has('godly') || cats.has('chroma')) return 'Godlies';
  if(cats.has('legendary')) return 'Legendaries';
  if(cats.has('rare')) return 'Rares';
  if(cats.has('uncommon')) return 'Uncommons';
  if(cats.has('common')) return 'Commons';
  return '';
}

function normalizeWeaponPage(page){
  const title=normalizeName(page.title);
  if(!title || page.ns!==0 || isMetaTitle(title)) return null;

  const category=classifyWeapon(page);
  if(!category) return null;

  const cats=pageCategoryNames(page);
  const isKnife=cats.has('knives');
  const isGun=cats.has('guns');
  const type=isKnife&&!isGun?'Knife':isGun&&!isKnife?'Gun':'Weapon';

  return {
    id:`fandom:${page.pageid}`,
    pageid:page.pageid,
    name:title,
    href:page.fullurl||wikiUrl(title),
    img:normalizeRemoteImageUrl(page.thumbnail?.source||page.original?.source||''),
    category,
    type
  };
}

function normalizePetPage(page){
  const title=normalizeName(page.title);
  if(!title || page.ns!==0 || isMetaTitle(title)) return null;

  return {
    id:`fandom:${page.pageid}`,
    pageid:page.pageid,
    name:title,
    href:page.fullurl||wikiUrl(title),
    img:normalizeRemoteImageUrl(page.thumbnail?.source||page.original?.source||''),
    category:'Pets',
    type:'Pet'
  };
}

async function fetchDatabase(){
  const hasUsableData=Object.values(DATA).some(list=>Array.isArray(list)&&list.length);
  if(!hasUsableData) setLoader(true,'Loading collection…');

  try{
    const indexNames=['Weapons','Pets'];

    const indexes={};

    for(let i=0;i<indexNames.length;i++){
      const name=indexNames[i];
      if(!hasUsableData){
        setLoader(true,`Fetching category indexes… ${i+1}/${indexNames.length}`);
      }
      indexes[name]=await fetchCategoryIndex(name);
    }



    if(!hasUsableData) setLoader(true,'Loading weapon images…');
    const weaponPages=await fetchPageDetails(indexes.Weapons,(done,total)=>{
      if(!hasUsableData) setLoader(true,`Loading weapons… ${done}/${total}`);
    });

    if(!hasUsableData) setLoader(true,'Loading pet images…');
    const petPages=await fetchPageDetails(indexes.Pets,(done,total)=>{
      if(!hasUsableData) setLoader(true,`Loading pets… ${done}/${total}`);
    });

    const weapons=[];
    const unclassified=[];

    for(const page of weaponPages){
      const item=normalizeWeaponPage(page);
      if(item) weapons.push(item);
      else if(page?.ns===0 && !isMetaTitle(page.title)) unclassified.push(page.title);
    }

    const pets=petPages
      .map(normalizePetPage)
      .filter(Boolean);

    let misc=[];
    try{
      if(!hasUsableData) setLoader(true,'Loading misc items…');
      misc=await fetchMiscItems();
    }catch(error){
      // Misc is supplemental. A temporary MM2Values/Jina failure must not break Weapons + Pets.
      console.warn('MM2Values Misc unavailable; continuing without Misc:',error);
    }

    const records=mergeRecords([weapons,pets,misc]);
    if(!records.length) throw new Error('Item sources returned no usable items.');

    DATA=classifyRecords(records);
    saveRawCache(records);
    saveDatabase(DATA);
    render();

    const counts=Object.fromEntries(CATEGORY_ORDER.map(category=>[category,DATA[category].length]));
    console.info('Fandom categories:',counts);
    console.info('Ancients:',DATA.Ancients.map(item=>item.name));
    console.info(`Fandom Weapons index: ${indexes.Weapons.length}`);
    console.info(`Fandom Pets index: ${indexes.Pets.length}`);
    console.info(`Collection total: ${records.length} items (Fandom Weapons + Pets, MM2Values Misc: ${misc.length})`);

    if(unclassified.length){
      console.warn(
        `Fandom unclassified weapons: ${unclassified.length}`,
        unclassified
      );
    }

    setLoader(false);
    return DATA;
  }catch(error){
    setLoader(false);
    throw error;
  }
}

function mergeRecords(groups){
  const byPageId=new Map();
  const byName=new Map();

  // Weapons first, then Pets, and EVO last so EVO always overrides its evolving rarity.
  for(const group of groups){
    for(const item of group){
      const id=String(item.pageid||item.id||'');
      const nameKey=normalizeKey(item.name);
      const existing=(id&&byPageId.get(id))||byName.get(nameKey);

      if(existing){
        if(item.category==='EVO') existing.category='EVO';
        if(!existing.img&&item.img) existing.img=item.img;
        if(!existing.href&&item.href) existing.href=item.href;
        continue;
      }

      const copy={...item};
      if(id) byPageId.set(id,copy);
      byName.set(nameKey,copy);
    }
  }

  return [...new Set(byName.values())];
}

function classifyRecords(records){
  const data=Object.fromEntries(CATEGORY_ORDER.map(category=>[category,[]]));

  for(const item of records){
    if(!data[item.category]) continue;
    data[item.category].push(item);
  }

  for(const category of CATEGORY_ORDER){
    data[category].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));
  }

  return data;
}


function categoryOwnedCount(category){
  const items=DATA[category]||[];
  let count=0;
  for(const item of items){
    const key=itemKey(category,item);
    const legacyKey=`${category}::${item.name}`;
    if(owned[key]||owned[legacyKey]) count++;
  }
  return count;
}

function ownedTotalCount(){
  let count=0;
  for(const category of CATEGORY_ORDER){
    count+=categoryOwnedCount(category);
  }
  return count;
}

function totalItemCount(){
  return CATEGORY_ORDER.reduce((sum,category)=>sum+(DATA[category]?.length||0),0);
}

function celebrateCategory(category){
  if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;

  const theme=CATEGORY_THEMES[category]||{base:'#ffffff',light:'#ffffff',deep:'#888888'};
  const section=[...document.querySelectorAll('.category')].find(el=>el.dataset.category===category);
  const header=section?.querySelector('.category-header');

  if(header){
    header.classList.remove('category-complete-pop');
    void header.offsetWidth;
    header.classList.add('category-complete-pop');
    setTimeout(()=>header.classList.remove('category-complete-pop'),800);
  }

  const toast=document.createElement('div');
  toast.className='category-complete-toast';
  toast.style.setProperty('--toast-cat',theme.base);
  toast.textContent=`${category} complete ✓`;
  document.body.append(toast);
  setTimeout(()=>toast.remove(),1900);

  const rect=header?.getBoundingClientRect()||{left:innerWidth/2-100,right:innerWidth/2+100,top:90,bottom:140,width:200,height:50};
  const originX=rect.left+rect.width/2;
  const originY=rect.top+Math.min(rect.height,52)/2;
  const palette=[theme.light,theme.base,theme.deep,'#ffffff'];
  const count=Math.min(72,Math.max(44,Math.round(innerWidth/24)));

  for(let i=0;i<count;i++){
    const piece=document.createElement('i');
    piece.className='confetti-piece';
    piece.style.left=`${originX}px`;
    piece.style.top=`${originY}px`;
    piece.style.background=palette[i%palette.length];
    piece.style.width=`${5+Math.random()*5}px`;
    piece.style.height=`${7+Math.random()*8}px`;
    document.body.append(piece);

    const spread=Math.min(innerWidth*.42,420);
    const x=(Math.random()-.5)*spread;
    const y=110+Math.random()*280;
    const lift=70+Math.random()*130;
    const rotate=(Math.random()-.5)*900;
    const duration=850+Math.random()*650;

    piece.animate([
      {transform:'translate(-50%,-50%) translate(0,0) rotate(0deg)',opacity:1},
      {offset:.28,transform:`translate(-50%,-50%) translate(${x*.38}px,${-lift}px) rotate(${rotate*.35}deg)`,opacity:1},
      {transform:`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${rotate}deg)`,opacity:0}
    ],{duration,easing:'cubic-bezier(.18,.72,.24,1)',fill:'forwards'}).onfinish=()=>piece.remove();
  }
}

function render(){
  const root=document.getElementById('categories');
  root.innerHTML='';

  let totalCount=0;
  let ownedCount=0;

  const entries=CATEGORY_ORDER.map(category=>[category,DATA[category]||[]]);

  if(entries.every(([,items])=>!items.length)){
    updateStats(0,0);
    return;
  }

  for(const [category,items] of entries){
    if(!items.length) continue;

    const section=document.createElement('section');
    section.className='category';
    section.dataset.category=category;
    const theme=CATEGORY_THEMES[category]||{base:'#888',light:'#bdbdbd',deep:'#444',glow:'rgba(255,255,255,.16)'};

    section.style.setProperty('--cat',theme.base);
    section.style.setProperty('--cat-light',theme.light);
    section.style.setProperty('--cat-deep',theme.deep);
    section.style.setProperty('--cat-glow',theme.glow);

    const header=document.createElement('div');
    header.className='category-header';
    const isCollapsed=!!collapsedCategories[category];
    if(isCollapsed) header.classList.add('collapsed');

    const h2=document.createElement('h2');
    h2.append(document.createTextNode(category+' '));
    const countSpan=document.createElement('span');
    countSpan.textContent=`(${items.length})`;
    h2.append(countSpan);

    const right=document.createElement('div');
    right.className='category-right';
    const progress=document.createElement('span');
    progress.className='cat-progress';
    const chev=document.createElement('span');
    chev.className='chev';
    chev.textContent='▼';
    right.append(progress,chev);
    header.append(h2,right);

    const grid=document.createElement('div');
    grid.className='items-grid';
    if(isCollapsed) grid.classList.add('collapsed');

    let catOwned=0;
    let visibleCount=0;

    for(const item of items){
      totalCount++;
      const key=itemKey(category,item);
      const legacyKey=`${category}::${item.name}`;
      const isOwned=!!owned[key]||!!owned[legacyKey];

      if(isOwned){ownedCount++;catOwned++;}

      const matchesSearch=!searchTerm||item.name.toLowerCase().includes(searchTerm);
      const matchesFilter=currentFilter==='all'||(currentFilter==='owned'&&isOwned)||(currentFilter==='missing'&&!isOwned);
      const visible=matchesSearch&&matchesFilter;
      if(visible) visibleCount++;

      const card=document.createElement('article');
      card.className='item-card'+(isOwned?' owned':'')+(visible?'':' hidden');
      const accent=document.createElement('div');
      accent.className='card-accent';
      const media=document.createElement('div');
      media.className='item-media';
      const img=document.createElement('img');
      img.alt=item.name;
      img.loading='lazy';
      img.decoding='async';
      // Fandom/static.wikia can reject hotlinked image requests when the
      // embedding GitHub Pages URL is sent as Referer. A local file sends no
      // useful Referer, which is why images worked locally but disappeared
      // after deployment.
      img.referrerPolicy='no-referrer';

      let failedOnce=false;
      img.addEventListener('error',()=>{
        if(failedOnce) return;
        failedOnce=true;
        img.src=placeholderUrl();
        img.classList.add('placeholder-image');
      });
      img.src=item.img||placeholderUrl();
      media.append(img);

      const name=document.createElement('div');
      name.className='name';
      name.textContent=item.name;

      const label=document.createElement('label');
      label.className='chk';
      const checkbox=document.createElement('input');
      checkbox.type='checkbox';
      checkbox.checked=isOwned;
      checkbox.addEventListener('change',()=>{
        const beforeOwned=categoryOwnedCount(category);
        const wasComplete=items.length>0&&beforeOwned===items.length;

        if(checkbox.checked) owned[key]=true;
        else delete owned[key];

        const afterOwned=checkbox.checked?beforeOwned+1:Math.max(0,beforeOwned-1);
        const justCompleted=!wasComplete&&items.length>0&&afterOwned===items.length;

        saveOwned();

        // Fast path: avoid rebuilding hundreds of cards on every checkbox click.
        card.classList.toggle('owned',checkbox.checked);
        progress.textContent=`${afterOwned}/${items.length}`;
        updateStats(totalItemCount(),ownedTotalCount());

        // Only filtering modes need visibility to be recalculated.
        if(currentFilter!=='all') render();

        if(justCompleted){
          requestAnimationFrame(()=>celebrateCategory(category));
        }
      });
      label.append(checkbox,document.createTextNode(' Owned'));
      card.append(accent,media,name,label);
      grid.append(card);
    }

    progress.textContent=`${catOwned}/${items.length}`;
    header.addEventListener('click',()=>{
      const collapsed=header.classList.toggle('collapsed');
      grid.classList.toggle('collapsed',collapsed);
      collapsedCategories[category]=collapsed;
      saveUiState();
    });

    section.append(header,grid);
    if(visibleCount===0&&(searchTerm||currentFilter!=='all')) section.style.display='none';
    root.append(section);
  }

  updateStats(totalCount,ownedCount);
}

function updateStats(total,have){
  const pct=total?Math.round(have/total*100):0;
  document.getElementById('statOwned').textContent=`${have}/${total}`;
  document.getElementById('progressBar').style.width=`${pct}%`;
  document.getElementById('progressPercent').textContent=`${pct}%`;
}

function setFilter(filter){
  currentFilter=filter;
  saveUiState();
  document.querySelectorAll('.filter-btn').forEach(btn=>btn.classList.remove('active'));
  const id=filter==='all'?'btnAll':filter==='owned'?'btnOwned':'btnMissing';
  document.getElementById(id)?.classList.add('active');
  render();
}

function bindControls(){
  const searchBox=document.getElementById('searchBox');
  const btnAll=document.getElementById('btnAll');
  const btnOwned=document.getElementById('btnOwned');
  const btnMissing=document.getElementById('btnMissing');

  if(searchBox){
    searchBox.value=savedUiState.search||'';
    searchBox.addEventListener('input',event=>{
      searchTerm=String(event.target.value||'').trim().toLowerCase();
      saveUiState();
      render();
    });
  }
  btnAll?.addEventListener('click',()=>setFilter('all'));
  btnOwned?.addEventListener('click',()=>setFilter('owned'));
  btnMissing?.addEventListener('click',()=>setFilter('missing'));

  document.querySelectorAll('.filter-btn').forEach(btn=>btn.classList.remove('active'));
  const activeId=currentFilter==='all'?'btnAll':currentFilter==='owned'?'btnOwned':'btnMissing';
  document.getElementById(activeId)?.classList.add('active');
}

function showFetchError(error){
  const root=document.getElementById('categories');
  root.innerHTML=`
    <section class="error-box glass">
      Failed to fetch data from the Murder Mystery 2 Wiki.<br>
      ${String(error?.message||error||'Unknown error')}
    </section>
  `;
  updateStats(0,0);
}

async function start(){
  bindControls();
  const cachedDb=getCachedDatabase();
  const overlay=document.getElementById('loadingOverlay');

  if(cachedDb?.data&&Object.keys(cachedDb.data).length){
    DATA=cachedDb.data;
    render();
    setLoader(false);

    const age=Date.now()-cachedDb.savedAt;
    if(age<DB_MAX_AGE){
      console.info(`Fandom cache is fresh (${Math.round(age/60000)} min old).`);
      return;
    }

    fetchDatabase().catch(error=>{
      console.warn('Background Fandom refresh failed; cache remains active:',error);
    });
    return;
  }

  const rawCache=getRawCache();
  if(rawCache?.records?.length){
    DATA=classifyRecords(rawCache.records);
    render();
    saveDatabase(DATA);
    setLoader(false);

    fetchDatabase().catch(error=>{
      console.warn('Background Fandom refresh failed; raw cache remains active:',error);
    });
    return;
  }

  try{
    await fetchDatabase();
  }catch(error){
    console.error(error);
    setLoader(false);
    showFetchError(error);
  }
}

start();

</script>
</body>
</html>
